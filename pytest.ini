[pytest]
# A suite da Fase 2 roda da raiz do projeto: python -m pytest
# Os imports sao do tipo "src.ga.*", entao a raiz precisa estar no sys.path
# (pytest adiciona rootdir automaticamente por causa do pytest.ini aqui).
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
filterwarnings =
    # saga/liblinear avisam quando max_iter e baixo. Isso e INFORMACAO pro
    # GA (o fitness cai), nao um defeito -- ver src/ga/fitness.py
    ignore::sklearn.exceptions.ConvergenceWarning
